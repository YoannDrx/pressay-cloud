version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Upgrade TypeScript with typescript-eslint compatibility verified together.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Match the deployed Node.js 22 runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Each stripe-node major pins a new Stripe API version (v23: 2026-09-30.endive).
      # Move it with a deliberate API version upgrade and webhook check.
      - dependency-name: stripe
        update-types: [version-update:semver-major]
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
